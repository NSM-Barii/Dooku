<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Dooku</title>
  <style>
    :root {
      --bg:         #080808;
      --surface:    #0f0f0f;
      --surface2:   #141414;
      --border:     #1e1414;
      --text:       #ececec;
      --muted:      #4a4a4a;
      --muted2:     #888;

      --wifi:       #dc143c;
      --wifi-bg:    #1a0208;
      --client:     #9b59b6;
      --client-bg:  #120a1a;
      --ble:        #4eaaff;
      --ble-bg:     #091a2e;

      --sig-good:   #00d26a;
      --sig-mid:    #ffd60a;
      --sig-bad:    #ff6b35;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding-bottom: 64px;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(8,8,8,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 0;
      margin-bottom: 12px;
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 5px;
      color: var(--wifi);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gps-pill {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #111;
      color: var(--muted2);
      border: 1px solid #222;
      transition: all 0.3s;
    }
    .gps-pill.fix {
      color: var(--sig-good);
      border-color: rgba(0,210,106,0.3);
      background: rgba(0,210,106,0.08);
    }

    .session-pill {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #111;
      color: var(--muted2);
      border: 1px solid #222;
    }

    .obfuscate-btn {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #111;
      color: var(--muted2);
      border: 1px solid #222;
      cursor: pointer;
      transition: all 0.2s;
    }
    .obfuscate-btn.on {
      background: rgba(255,214,10,0.1);
      color: var(--sig-mid);
      border-color: rgba(255,214,10,0.4);
    }

    .coords-bar {
      padding: 0 16px 8px;
      font-size: 10px;
      font-family: monospace;
      color: var(--sig-good);
      letter-spacing: 0.5px;
      display: none;
    }
    .coords-bar.visible { display: block; }

    .pulse {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .pulse.live { background: var(--wifi); box-shadow: 0 0 8px var(--wifi); }

    /* ── STATS ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      padding: 0 12px 12px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
    }

    .stat .val {
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }
    .stat .lbl {
      font-size: 8px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted2);
      margin-top: 3px;
    }

    .stat.s-total  .val { color: #fff; }
    .stat.s-ap     .val { color: var(--wifi); }
    .stat.s-client .val { color: var(--client); }
    .stat.s-ble    .val { color: var(--ble); }
    .stat.s-new    .val { color: var(--sig-mid); }
    .stat.s-pkts   .val { color: var(--sig-bad); }

    /* ── FILTER BAR ── */
    .filter-bar {
      padding: 0 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pills {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
    }

    .pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 4px 9px;
      border-radius: 20px;
      border: 1px solid #222;
      background: transparent;
      color: var(--muted2);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .pill.active {
      background: var(--wifi-bg);
      color: var(--wifi);
      border-color: rgba(220,20,60,0.4);
    }

    .sort-select {
      margin-left: auto;
      background: var(--surface);
      color: var(--muted2);
      border: 1px solid #222;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 4px 6px;
      outline: none;
      cursor: pointer;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      border-top: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 11px 0;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab.active       { color: var(--wifi);   border-color: var(--wifi);   }
    .tab.active.t-cl  { color: var(--client); border-color: var(--client); }
    .tab.active.t-ble { color: var(--ble);    border-color: var(--ble);    }
    .tab.active.t-src { color: var(--muted2); border-color: var(--muted2); }

    /* ── FEED ── */
    .feed {
      padding: 12px 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .card:active { border-color: #333; }

    .card.ap     { border-left: 3px solid var(--wifi);   }
    .card.client { border-left: 3px solid var(--client); }
    .card.ble    { border-left: 3px solid var(--ble);    }
    .card.source { border-left: 3px solid #333;          }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .badges {
      display: flex;
      gap: 4px;
      flex-wrap: nowrap;
      align-items: center;
      min-width: 0;
    }

    /* ── SIGNAL BAR ── */
    .rssi-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .rssi-val {
      font-size: 12px;
      font-weight: 600;
      font-family: monospace;
      min-width: 34px;
      text-align: right;
      white-space: nowrap;
    }
    .sig-bar {
      width: 44px;
      height: 5px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sig-fill {
      height: 100%;
      border-radius: 3px;
    }

    /* ── DEVICE INFO ── */
    .device-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .device-sub {
      font-size: 11px;
      color: var(--muted2);
      font-family: monospace;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .device-meta {
      font-size: 11px;
      color: var(--muted2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .device-meta b { color: #666; font-weight: 500; }

    /* ── BADGES ── */
    .badge {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge.wpa3   { background: rgba(0,210,106,0.12);  color: #00d26a; }
    .badge.wpa2   { background: rgba(78,170,255,0.12); color: #4eaaff; }
    .badge.wpa    { background: rgba(255,214,10,0.12); color: #ffd60a; }
    .badge.wep    { background: rgba(255,107,53,0.15); color: #ff6b35; }
    .badge.open   { background: rgba(220,20,60,0.12);  color: #dc143c; }
    .badge.b-new  { background: rgba(255,214,10,0.15); color: #ffd60a; }
    .badge.b-gps  { background: rgba(0,210,106,0.12);  color: #00d26a; }
    .badge.b-cl   { background: rgba(155,89,182,0.12); color: #9b59b6; }
    .badge.b-ble  { background: rgba(78,170,255,0.12); color: #4eaaff; }

    .src-ok      { background: rgba(0,210,106,0.12);  color: #00d26a; }
    .src-err     { background: rgba(220,20,60,0.12);  color: #dc143c; }
    .src-stopped { background: rgba(74,74,74,0.2);    color: #666;    }

    /* ── SOURCES ── */
    .source-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .source-iface {
      font-size: 11px;
      font-weight: 400;
      color: var(--muted2);
      font-family: monospace;
    }

    /* ── OFFLINE / EMPTY ── */
    .empty {
      text-align: center;
      color: var(--muted2);
      font-size: 13px;
      padding: 60px 20px;
    }
    .empty-icon {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .offline-banner {
      margin: 12px;
      padding: 14px 16px;
      background: rgba(220,20,60,0.08);
      border: 1px solid rgba(220,20,60,0.2);
      border-radius: 10px;
      font-size: 12px;
      color: #dc143c;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* ── DETAIL SHEET ── */
    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .sheet-overlay.open { display: block; }

    .sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      z-index: 101;
      max-height: 85vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      padding-bottom: 30px;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: #333;
      border-radius: 2px;
      margin: 12px auto 0;
    }

    .sheet-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
    }
    .sheet-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      word-break: break-all;
    }
    .sheet-sub {
      font-size: 11px;
      color: var(--muted2);
      font-family: monospace;
    }
    .sheet-badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .sheet-section {
      padding: 14px 18px 0;
    }
    .sheet-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted2);
      margin-bottom: 8px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .detail-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .detail-item.full { grid-column: 1 / -1; }
    .detail-val {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }
    .detail-lbl {
      font-size: 10px;
      color: var(--muted2);
      letter-spacing: 0.3px;
    }

    .sig-detail {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sig-detail-bar {
      flex: 1;
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
    }
    .sig-detail-fill {
      height: 100%;
      border-radius: 3px;
    }

    .ssid-history-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--muted2);
      margin-bottom: 6px;
      font-family: monospace;
    }

    /* ── BOTTOM BAR ── */
    .bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(8,8,8,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--muted2);
      gap: 8px;
    }

.brand {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--wifi);
      white-space: nowrap;
    }

    .action-btn {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid #333;
      background: #111;
      color: var(--muted2);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .action-btn.wardrive {
      border-color: rgba(220,20,60,0.4);
      color: var(--wifi);
      background: rgba(220,20,60,0.08);
    }
    .action-btn.shutdown { color: #444; }
    .action-btn:active { opacity: 0.6; }

    .expand-bar {
      text-align: center;
      padding: 12px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--muted2);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
      margin-top: 4px;
    }
    .expand-bar:active { opacity: 0.6; }
  </style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="logo">DOOKU</div>
    <div class="header-right">
      <span class="session-pill" id="session-pill">00:00:00</span>
      <span class="gps-pill" id="gps-pill">GPS</span>
      <div class="pulse" id="pulse"></div>
    </div>
  </div>
  <div class="coords-bar" id="coords-bar"></div>

  <div class="stats">
    <div class="stat s-total">  <div class="val" id="s-total">0</div>  <div class="lbl">Total</div>  </div>
    <div class="stat s-ap">     <div class="val" id="s-ap">0</div>     <div class="lbl">APs</div>     </div>
    <div class="stat s-client"> <div class="val" id="s-client">0</div> <div class="lbl">Clients</div> </div>
    <div class="stat s-ble">    <div class="val" id="s-ble">0</div>    <div class="lbl">BLE</div>     </div>
    <div class="stat s-new">    <div class="val" id="s-new">0</div>    <div class="lbl">New</div>     </div>
    <div class="stat s-pkts">   <div class="val" id="s-pkts">—</div>   <div class="lbl">Pkts/s</div> </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <div class="filter-row">
      <div class="pills" id="band-pills">
        <button class="pill active" data-band="all">ALL</button>
        <button class="pill"        data-band="2.4">2.4</button>
        <button class="pill"        data-band="5">5GHz</button>
        <button class="pill"        data-band="6">6GHz</button>
      </div>
      <select class="sort-select" id="sort-select">
        <option value="rssi">Signal</option>
        <option value="name">Name</option>
        <option value="packets">Packets</option>
        <option value="first">First Seen</option>
      </select>
    </div>
    <div class="filter-row" id="enc-row">
      <div class="pills" id="enc-pills">
        <button class="pill active" data-enc="all">ALL</button>
        <button class="pill"        data-enc="open">OPEN</button>
        <button class="pill"        data-enc="wpa2">WPA2</button>
        <button class="pill"        data-enc="wpa3">WPA3</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active"  data-tab="networks">NETWORKS</div>
    <div class="tab t-cl"    data-tab="clients">CLIENTS</div>
    <div class="tab t-ble"   data-tab="ble">BLE</div>
    <div class="tab t-src"   data-tab="sources">SOURCES</div>
  </div>
</header>

<div class="feed" id="feed"></div>

<div class="sheet-overlay" id="sheet-overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-sub"  id="sheet-sub"></div>
    <div class="sheet-badges" id="sheet-badges"></div>
  </div>
  <div id="sheet-body"></div>
</div>

<div class="bottom">
  <span id="last-update">Waiting...</span>
  <button class="obfuscate-btn" id="obfuscate-btn">Hide Info</button>
  <button class="action-btn wardrive" id="wardrive-btn">WARDRIVE</button>
  <button class="action-btn" id="wigle-btn">WIGLE</button>
  <button class="action-btn shutdown" id="shutdown-btn">⏻</button>
</div>

<script>
  // ── STATE ─────────────────────────────────────────────────

  let devices      = [];
  let sources      = [];
  let sysStatus    = null;
  let gpsData      = null;
  let activeTab    = "networks";
  let activeBand   = "all";
  let activeEnc    = "all";
  let activeSort   = "rssi";
  let kismetOnline = false;
  let obfuscated   = false;
  let showAll      = false;
  const PAGE_SIZE  = 100;

  const deviceMap  = {};  // mac -> full device object for sheet lookup

  const sessionStart = Date.now() / 1000;

  const $  = id => document.getElementById(id);
  const pulse       = $("pulse");
  const feed        = $("feed");
  const lastUpdate  = $("last-update");
  const gpsPill     = $("gps-pill");
  const sessionPill = $("session-pill");
  const coordsBar   = $("coords-bar");

  let kismetStartSec = null;

  function maskMac(mac) {
    if (!mac || !obfuscated) return mac;
    const parts = mac.split(":");
    return parts.slice(0, 3).join(":") + ":??:??:??";
  }

  function maskSsid(ssid) {
    if (!ssid || !obfuscated) return ssid;
    if (ssid === "<hidden>" || ssid === "<unknown>") return ssid;
    const keep = Math.min(3, ssid.length);
    return ssid.slice(0, keep) + "*".repeat(Math.max(0, ssid.length - keep));
  }

  function fmtDuration(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = Math.floor(secs % 60);
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  setInterval(() => {
    if (!kismetStartSec) return;
    const elapsed = Math.floor(Date.now() / 1000) - kismetStartSec;
    sessionPill.textContent = fmtDuration(elapsed);
  }, 1000);


  // ── HELPERS ───────────────────────────────────────────────

  function getBand(freq) {
    if (!freq || freq === 0) return null;
    const mhz = freq > 100000 ? freq / 1000 : freq; // Kismet sends kHz
    if (mhz >= 2400 && mhz < 2500) return "2.4";
    if (mhz >= 5150 && mhz < 5900) return "5";
    if (mhz >= 5925)                return "6";
    return null;
  }

  function rssiHTML(rssi) {
    if (rssi == null || rssi === 0) return `<div class="rssi-wrap"><span class="rssi-val" style="color:var(--muted2)">—</span></div>`;
    const pct   = Math.max(4, Math.min(100, ((rssi + 90) / 60) * 100));
    const color = pct > 66 ? "var(--sig-good)" : pct > 33 ? "var(--sig-mid)" : "var(--sig-bad)";
    return `
      <div class="rssi-wrap">
        <span class="rssi-val" style="color:${color}">${rssi}</span>
        <div class="sig-bar"><div class="sig-fill" style="width:${pct}%;background:${color}"></div></div>
      </div>`;
  }

  function encBadge(enc) {
    if (!enc || enc === 0) return "";
    const s = String(enc).toUpperCase();
    if (s.includes("WPA3"))                         return '<span class="badge wpa3">WPA3</span>';
    if (s.includes("WPA2"))                         return '<span class="badge wpa2">WPA2</span>';
    if (s.includes("WPA"))                          return '<span class="badge wpa">WPA</span>';
    if (s.includes("WEP"))                          return '<span class="badge wep">WEP</span>';
    if (s === "OPEN" || s === "NONE" || s === "OPN" || s.includes("OPEN"))
                                                    return '<span class="badge open">OPEN</span>';
    return "";
  }

  function isNew(d)    { return d.first_seen && d.first_seen > sessionStart - 300; }
  function hasGps(d)   { return d.geopoint && Array.isArray(d.geopoint) && (d.geopoint[0] !== 0 || d.geopoint[1] !== 0); }
  function isAP(d)     { return String(d.type || "").includes("AP"); }
  function isClient(d) { return String(d.type || "").toLowerCase().includes("client"); }
  function isBLE(d)    { const t = String(d.type || "").toUpperCase(); return t === "BTLE" || t.includes("BLUETOOTH"); }

  function bandMatch(d) {
    if (activeBand === "all") return true;
    return getBand(d.frequency) === activeBand;
  }

  function encMatch(d) {
    if (activeEnc === "all") return true;
    const s = String(d.encryption || "").toUpperCase();
    if (activeEnc === "open") return !s.includes("WPA") && !s.includes("WEP");
    if (activeEnc === "wpa2") return s.includes("WPA2") && !s.includes("WPA3");
    if (activeEnc === "wpa3") return s.includes("WPA3");
    return true;
  }

  function sorted(arr) {
    return [...arr].sort((a, b) => {
      if (activeSort === "rssi")    return (b.rssi    || -999) - (a.rssi    || -999);
      if (activeSort === "name")    return (a.name    || "").localeCompare(b.name || "");
      if (activeSort === "packets") return (b.packets || 0)   - (a.packets || 0);
      if (activeSort === "first")   return (b.first_seen || 0) - (a.first_seen || 0);
      return 0;
    });
  }

  function fmtPkts(n) {
    if (!n || n === 0) return "";
    return n >= 1000 ? `${(n/1000).toFixed(1)}k pkts` : `${n} pkts`;
  }


  // ── CARD RENDERERS ────────────────────────────────────────

  function apCard(d) {
    const ssid    = maskSsid((d.ssid && d.ssid !== 0) ? d.ssid : (d.name || "<hidden>"));
    const mac     = maskMac(d.mac || "");
    const band    = getBand(d.frequency);
    const bandStr = band ? `${band}GHz` : "";
    const ch      = d.channel  || "?";
    const vendor  = d.vendor   || "";
    const pkts    = fmtPkts(d.packets);
    const meta    = [ch !== "?" ? `ch ${ch}` : "", bandStr, pkts].filter(Boolean).join(" · ");

    return `
      <div class="card ap" onclick="openSheet(deviceMap['${d.mac}'])">
        <div class="card-top">
          <div class="badges">
            ${encBadge(d.encryption)}
            ${d.clients > 0 ? `<span class="badge b-cl">${d.clients} CLI</span>` : ""}
            ${isNew(d)  ? '<span class="badge b-new">NEW</span>' : ""}
            ${hasGps(d) ? '<span class="badge b-gps">GPS</span>' : ""}
          </div>
          ${rssiHTML(d.rssi)}
        </div>
        <div class="device-name">${ssid}</div>
        <div class="device-sub">${mac}${vendor ? " · " + vendor : ""}</div>
        ${meta ? `<div class="device-meta">${meta}</div>` : ""}
      </div>`;
  }

  function clientCard(d) {
    const name   = maskSsid(d.name) || maskMac(d.mac) || "—";
    const sub    = d.name && d.mac ? maskMac(d.mac) : "";
    const vendor = d.vendor || "";
    const band   = getBand(d.frequency);
    const ch     = d.channel || "?";
    const meta   = [ch !== "?" ? `ch ${ch}` : "", band ? `${band}GHz` : "", fmtPkts(d.packets)].filter(Boolean).join(" · ");

    return `
      <div class="card client" onclick="openSheet(deviceMap['${d.mac}'])">
        <div class="card-top">
          <div class="badges">
            <span class="badge b-cl">CLIENT</span>
            ${isNew(d) ? '<span class="badge b-new">NEW</span>' : ""}
          </div>
          ${rssiHTML(d.rssi)}
        </div>
        <div class="device-name">${name}</div>
        <div class="device-sub">${sub}${vendor ? (sub ? " · " : "") + vendor : ""}</div>
        ${meta ? `<div class="device-meta">${meta}</div>` : ""}
      </div>`;
  }

  function bleCard(d) {
    const name   = maskSsid(d.name || "<unknown>");
    const vendor = d.vendor || "";
    const pkts   = fmtPkts(d.packets);
    const sub    = String(d.type || "").toUpperCase();

    return `
      <div class="card ble" onclick="openSheet(deviceMap['${d.mac}'])">
        <div class="card-top">
          <div class="badges">
            <span class="badge b-ble">${sub || "BLE"}</span>
            ${isNew(d) ? '<span class="badge b-new">NEW</span>' : ""}
          </div>
          ${rssiHTML(d.rssi)}
        </div>
        <div class="device-name">${name}</div>
        <div class="device-sub">${maskMac(d.mac) || ""}${vendor ? " · " + vendor : ""}</div>
        ${pkts ? `<div class="device-meta">${pkts}</div>` : ""}
      </div>`;
  }

  function sourceCard(s) {
    const name    = s["kismet.datasource.name"]      || "Unknown";
    const iface   = s["kismet.datasource.interface"] || "?";
    const running = s["kismet.datasource.running"]   === 1 || s["kismet.datasource.running"]  === true;
    const error   = s["kismet.datasource.error"]     === 1 || s["kismet.datasource.error"]    === true;
    const ch      = s["kismet.datasource.channel"]   || "—";
    const numSrc  = s["kismet.datasource.num_packets"];

    const cls  = error ? "src-err" : running ? "src-ok" : "src-stopped";
    const txt  = error ? "ERROR"   : running ? "RUNNING" : "STOPPED";
    const pkts = numSrc > 0 ? ` · ${numSrc.toLocaleString()} pkts` : "";

    return `
      <div class="card source">
        <div class="card-top">
          <div class="source-name">${name} <span class="source-iface">${iface}</span></div>
          <span class="badge ${cls}">${txt}</span>
        </div>
        <div class="device-meta">ch ${ch}${pkts}</div>
      </div>`;
  }


  // ── RENDER ────────────────────────────────────────────────

  function render() {
    if (!kismetOnline) {
      feed.innerHTML = `<div class="offline-banner">KISMET OFFLINE — start Kismet to begin capture</div>`;
      return;
    }

    if (activeTab === "sources") {
      feed.innerHTML = sources.length
        ? sources.map(sourceCard).join("")
        : `<div class="empty"><div class="empty-icon">⚙</div>No sources reported</div>`;
      return;
    }

    let list = devices;
    if      (activeTab === "networks") list = list.filter(isAP);
    else if (activeTab === "clients")  list = list.filter(isClient);
    else if (activeTab === "ble")      list = list.filter(isBLE);

    if (activeTab === "networks" || activeTab === "clients") list = list.filter(bandMatch);
    if (activeTab === "networks") list = list.filter(encMatch);

    list = sorted(list);

    if (!list.length) {
      feed.innerHTML = `<div class="empty"><div class="empty-icon">⚔</div>No devices match filters</div>`;
      return;
    }

    const total   = list.length;
    const visible = showAll ? list : list.slice(0, PAGE_SIZE);

    let html = "";
    if      (activeTab === "networks") html = visible.map(apCard).join("");
    else if (activeTab === "clients")  html = visible.map(clientCard).join("");
    else if (activeTab === "ble")      html = visible.map(bleCard).join("");

    if (total > PAGE_SIZE) {
      html += showAll
        ? `<div class="expand-bar" onclick="toggleShow()">▲ Show less</div>`
        : `<div class="expand-bar" onclick="toggleShow()">▼ Show all ${total.toLocaleString()}</div>`;
    }

    feed.innerHTML = html;
  }


  // ── STATS ─────────────────────────────────────────────────

  function updateStats(counts) {
    const newCnt = devices.filter(isNew).length;

    if (counts) {
      $("s-total").textContent  = counts.total   || 0;
      $("s-ap").textContent     = counts.aps     || 0;
      $("s-client").textContent = counts.clients || 0;
      $("s-ble").textContent    = counts.ble     || 0;
    } else {
      $("s-total").textContent  = devices.length;
      $("s-ap").textContent     = devices.filter(isAP).length;
      $("s-client").textContent = devices.filter(isClient).length;
      $("s-ble").textContent    = devices.filter(isBLE).length;
    }
    $("s-new").textContent = newCnt;

    if (sources.length) {
      const totalRate = sources.reduce((sum, s) => {
        const rrd = s["kismet.datasource.packets_rrd"];
        return sum + (rrd ? (rrd["kismet.common.rrd.last_value_n1"] || 0) : 0);
      }, 0);
      $("s-pkts").textContent = totalRate > 0 ? totalRate : "—";
    }

    if (sysStatus) {
      const start = sysStatus["kismet.system.timestamp.start_sec"];
      if (start) kismetStartSec = start;
    }

    if (gpsData) {
      const fix    = gpsData["kismet.common.location.fix"];
      const gp     = gpsData["kismet.common.location.geopoint"];
      if (fix >= 2 && gp && (gp[0] !== 0 || gp[1] !== 0)) {
        const lat = gp[1].toFixed(6);
        const lon = gp[0].toFixed(6);
        const spd = gpsData["kismet.common.location.speed"];
        const spdStr = spd > 0 ? ` · ${(spd * 3.6).toFixed(1)} km/h` : "";
        gpsPill.className    = "gps-pill fix";
        gpsPill.textContent  = "GPS FIX";
        coordsBar.className  = "coords-bar visible";
        coordsBar.textContent = `${lat}, ${lon}${spdStr}`;
      } else {
        gpsPill.className   = "gps-pill";
        gpsPill.textContent = "GPS";
        coordsBar.className = "coords-bar";
      }
    }
  }


  // ── POLLING ───────────────────────────────────────────────

  let lastPollTime = null;

  async function pollDevices() {
    const url = lastPollTime
      ? `/kismet/devices?since=${Math.floor(lastPollTime - 1)}`
      : "/kismet/devices";

    try {
      const now  = Date.now() / 1000;
      const res  = await fetch(url);
      const data = await res.json();

      if (res.ok && Array.isArray(data)) {
        // merge delta into map — never replace everything
        data.forEach(d => { if (d.mac) deviceMap[d.mac] = d; });
        devices      = Object.values(deviceMap);
        lastPollTime = now;
        kismetOnline = true;
        pulse.className        = "pulse live";
        lastUpdate.textContent = `${devices.length} loaded · ${new Date().toLocaleTimeString()}`;
        updateStats();
        render();
      } else {
        throw new Error(data.error || "bad response");
      }
    } catch {
      kismetOnline           = false;
      pulse.className        = "pulse";
      lastUpdate.textContent = "Kismet offline";
      render();
    }
  }

  async function pollStatus() {
    try {
      const res  = await fetch("/kismet/status");
      const data = await res.json();
      if (res.ok && !data.error) {
        sysStatus = data.status  || null;
        sources   = data.sources || [];
        gpsData   = data.gps     || null;
        updateStats(data.counts || null);
        if (activeTab === "sources") render();
      }
    } catch {}
  }


  // ── EVENT HANDLERS ────────────────────────────────────────

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      activeTab = tab.dataset.tab;

      const showFilter  = activeTab === "networks" || activeTab === "clients";
      const showEncRow  = activeTab === "networks";
      $("filter-bar").style.display = showFilter ? "" : "none";
      $("enc-row").style.display    = showEncRow  ? "" : "none";

      render();
    });
  });

  document.querySelectorAll(".pill[data-band]").forEach(p => {
    p.addEventListener("click", () => {
      document.querySelectorAll(".pill[data-band]").forEach(x => x.classList.remove("active"));
      p.classList.add("active");
      activeBand = p.dataset.band;
      render();
    });
  });

  document.querySelectorAll(".pill[data-enc]").forEach(p => {
    p.addEventListener("click", () => {
      document.querySelectorAll(".pill[data-enc]").forEach(x => x.classList.remove("active"));
      p.classList.add("active");
      activeEnc = p.dataset.enc;
      render();
    });
  });

  $("sort-select").addEventListener("change", e => {
    activeSort = e.target.value;
    render();
  });

  $("obfuscate-btn").addEventListener("click", () => {
    obfuscated = !obfuscated;
    const btn  = $("obfuscate-btn");
    btn.textContent = obfuscated ? "Show Info" : "Hide Info";
    btn.className   = obfuscated ? "obfuscate-btn on" : "obfuscate-btn";
    if (obfuscated) coordsBar.className = "coords-bar";
    render();
  });



  // ── DETAIL SHEET ─────────────────────────────────────────

  const sheet        = $("sheet");
  const sheetOverlay = $("sheet-overlay");

  async function openSheet(d) {
    if (!d) return;
    try {
      const res  = await fetch(`/kismet/device/${d.mac}`);
      const full = await res.json();
      if (full && full.mac) d = full;
    } catch {}

    const ssid   = maskSsid((d.ssid && d.ssid !== 0) ? d.ssid : (d.name || "<hidden>"));
    const mac    = maskMac(d.mac || "");
    const vendor = d.vendor || "";

    $("sheet-title").textContent  = ssid;
    $("sheet-sub").textContent    = mac + (vendor ? " · " + vendor : "");
    $("sheet-badges").innerHTML   = [
      encBadge(d.encryption),
      d.clients > 0 ? `<span class="badge b-cl">${d.clients} CLI</span>` : "",
      isNew(d)       ? '<span class="badge b-new">NEW</span>'             : "",
      hasGps(d)      ? '<span class="badge b-gps">GPS</span>'             : "",
    ].join("");

    const fmtTime = ts => ts ? new Date(ts * 1000).toLocaleTimeString() : "—";
    const fmtDate = ts => ts ? new Date(ts * 1000).toLocaleDateString() : "—";
    const active  = (d.first_seen && d.last_seen)
      ? fmtDuration(d.last_seen - d.first_seen) : "—";

    const sigPct  = rssi => Math.max(4, Math.min(100, ((rssi + 90) / 60) * 100));
    const sigCol  = rssi => sigPct(rssi) > 66 ? "var(--sig-good)" : sigPct(rssi) > 33 ? "var(--sig-mid)" : "var(--sig-bad)";

    const band    = getBand(d.frequency);
    const freq    = d.frequency ? `${(d.frequency / 1000).toFixed(0)} MHz` : "—";
    const rate    = d.max_rate  ? `${(d.max_rate / 10).toFixed(0)} Mbps`  : "—";
    const country = (d.country && d.country !== "0") ? d.country : "—";

    const hsCount = Array.isArray(d.handshakes) ? d.handshakes.length
                  : (d.handshakes && d.handshakes > 0) ? d.handshakes : 0;

    // SSID history from ssid_map
    let ssidHistory = "";
    if (Array.isArray(d.ssid_map) && d.ssid_map.length > 1) {
      ssidHistory = `
        <div class="sheet-section">
          <div class="sheet-label">SSID History</div>
          ${d.ssid_map.map(s => `<div class="ssid-history-item">${maskSsid(s["dot11.advertisedssid.ssid"] || "hidden")}</div>`).join("")}
        </div>`;
    }

    const geoStr = hasGps(d) && Array.isArray(d.geopoint)
      ? `${d.geopoint[1].toFixed(6)}, ${d.geopoint[0].toFixed(6)}` : null;

    $("sheet-body").innerHTML = `
      <div class="sheet-section">
        <div class="sheet-label">Signal</div>
        <div class="detail-grid">
          <div class="detail-item">
            <div class="detail-val" style="color:${sigCol(d.rssi)}">${d.rssi ?? "—"} dBm</div>
            <div class="sig-detail-bar" style="margin-top:6px"><div class="sig-detail-fill" style="width:${d.rssi ? sigPct(d.rssi) : 0}%;background:${sigCol(d.rssi)}"></div></div>
            <div class="detail-lbl" style="margin-top:4px">Current</div>
          </div>
          <div class="detail-item">
            <div class="detail-val" style="color:${sigCol(d.rssi_max)}">${d.rssi_max ?? "—"} dBm</div>
            <div class="sig-detail-bar" style="margin-top:6px"><div class="sig-detail-fill" style="width:${d.rssi_max ? sigPct(d.rssi_max) : 0}%;background:${sigCol(d.rssi_max)}"></div></div>
            <div class="detail-lbl" style="margin-top:4px">Best</div>
          </div>
        </div>
      </div>

      <div class="sheet-section" style="margin-top:12px">
        <div class="sheet-label">Network</div>
        <div class="detail-grid">
          <div class="detail-item">
            <div class="detail-val">ch ${d.channel || "?"}</div>
            <div class="detail-lbl">${freq}</div>
          </div>
          <div class="detail-item">
            <div class="detail-val">${band ? band + " GHz" : "—"}</div>
            <div class="detail-lbl">Band</div>
          </div>
          <div class="detail-item">
            <div class="detail-val">${d.ht_mode || "—"}</div>
            <div class="detail-lbl">HT Mode</div>
          </div>
          <div class="detail-item">
            <div class="detail-val">${rate}</div>
            <div class="detail-lbl">Max Rate</div>
          </div>
          <div class="detail-item">
            <div class="detail-val">${country}</div>
            <div class="detail-lbl">Country</div>
          </div>
          <div class="detail-item">
            <div class="detail-val" style="color:${hsCount > 0 ? 'var(--sig-mid)' : 'var(--muted2)'}">${hsCount}</div>
            <div class="detail-lbl">Handshakes</div>
          </div>
        </div>
      </div>

      <div class="sheet-section" style="margin-top:12px">
        <div class="sheet-label">Activity</div>
        <div class="detail-grid">
          <div class="detail-item">
            <div class="detail-val">${fmtTime(d.first_seen)}</div>
            <div class="detail-lbl">First Seen · ${fmtDate(d.first_seen)}</div>
          </div>
          <div class="detail-item">
            <div class="detail-val">${fmtTime(d.last_seen)}</div>
            <div class="detail-lbl">Last Seen</div>
          </div>
          <div class="detail-item">
            <div class="detail-val">${active}</div>
            <div class="detail-lbl">Active For</div>
          </div>
          <div class="detail-item">
            <div class="detail-val">${(d.packets || 0).toLocaleString()}</div>
            <div class="detail-lbl">Packets</div>
          </div>
        </div>
      </div>

      ${geoStr ? `
      <div class="sheet-section" style="margin-top:12px">
        <div class="sheet-label">Last Known Location</div>
        <div class="detail-grid">
          <div class="detail-item full">
            <div class="detail-val" style="font-family:monospace;font-size:13px;color:var(--sig-good)">${geoStr}</div>
            <div class="detail-lbl">GPS Coordinates</div>
          </div>
        </div>
      </div>` : ""}

      ${ssidHistory}
    `;

    sheetOverlay.className = "sheet-overlay open";
    sheet.className        = "sheet open";
  }

  function closeSheet() {
    sheet.className        = "sheet";
    sheetOverlay.className = "sheet-overlay";
  }

  sheetOverlay.addEventListener("click", closeSheet);
  sheet.addEventListener("click", e => e.stopPropagation());


  // ── START ─────────────────────────────────────────────────

  pollDevices();
  pollStatus();
  setInterval(pollDevices, 2000);
  setInterval(pollStatus,  5000);

  function toggleShow() {
    showAll = !showAll;
    render();
    if (!showAll) window.scrollTo(0, 0);
  }

  $("wardrive-btn").addEventListener("click", async () => {
    const btn = $("wardrive-btn");
    btn.textContent = "STARTING...";
    btn.style.opacity = "0.5";
    await fetch("/wardrive");
    setTimeout(() => { btn.textContent = "WARDRIVE"; btn.style.opacity = ""; }, 3000);
  });

  $("wigle-btn").addEventListener("click", async () => {
    const btn = $("wigle-btn");
    btn.textContent = "UPLOADING...";
    btn.style.opacity = "0.5";
    try {
      const res  = await fetch("/wigle-upload");
      const data = await res.json();
      if (data.error) alert("WiGLE: " + data.error);
      else alert("WiGLE upload OK — " + (data.file || ""));
    } catch { alert("WiGLE upload failed"); }
    btn.textContent = "WIGLE";
    btn.style.opacity = "";
  });

  $("shutdown-btn").addEventListener("click", async () => {
    if (!confirm("Shut down the Pi?")) return;
    await fetch("/shutdown");
  });
</script>
</body>
</html>
