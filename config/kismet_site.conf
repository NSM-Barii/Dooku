# Dooku — Kismet site config
# Loaded automatically by Kismet on every start.
# Lives in /etc/kismet/kismet_site.conf


# ── CREDENTIALS ───────────────────────────────────────────
httpd_username=kismet
httpd_password=dooku


# ── BLUETOOTH (uncomment to enable) ──────────────────────
# hci0 = Pi built-in (always present)
# hci1 = external USB adapter (only if plugged in)
#source=hci0:name=BT-Internal
#source=hci1:name=BT-External,retry=true


# ── RTL-SDR (uncomment to enable) ────────────────────────
#source=rtladsb-0:name=ADSB,retry=true


# ── SOURCES (4x AWUS036ACS) ───────────────────────────────
source=wlan1:name=Alpha
source=wlan2:name=Bravo,disable_vif=true
source=wlan3:name=Charlie,disable_vif=true
source=wlan4:name=Delta,disable_vif=true


# ── CHANNEL HOPPING ───────────────────────────────────────
# Split channel list across all adapters so they cover different
# channels simultaneously instead of all hopping in sync
channel_hop_split=true
channel_hop_rate=5/sec


# ── GPS ───────────────────────────────────────────────────
gps=gpsd:host=localhost,port=2947


# ── LOGGING ───────────────────────────────────────────────
log_prefix=DOOKU_BASE/kismet/sessions/
log_types=kismet,wiglecsv
